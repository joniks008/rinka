jobs: {nuskaityti: {runs-on: ubuntu-latest, timeout-minutes: 90, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '22'}}, {run: npm install cheerio --no-save}, {run: node nuskaityk.js}, {name: Irasyti pakeitimus, run: "git config user.name robotas && git config user.email robotas@users.noreply.github.com && git add -A -- . ':!node_modules' ':!package-lock.json' ':!package.json' && (git diff --cached --quiet || git commit -m Atnaujinta) && git push"}]}}
